<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETERNA / CORE // FORMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
      :root {
        --neon-cyan: #00f3ff;
        --neon-magenta: #bc13fe;
        --void-dark: #050510;
        --glass-bg: rgba(10, 10, 25, 0.4);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        background-color: var(--void-dark);
        font-family: "Rajdhani", sans-serif;
        color: white;
        padding: 20px;
      }

      /* --- Quantum Field Canvas --- */
      #quantum-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: all;
      }

      .form-container {
        max-width: 800px;
        margin: 0 auto;
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
          inset 0 0 30px rgba(0, 243, 255, 0.05);
        overflow: hidden;
        position: relative;
        z-index: 10;
      }

      .form-container::before {
        content: "";
        position: absolute;
        inset: -1px;
        background: linear-gradient(
          45deg,
          transparent,
          var(--neon-cyan),
          transparent,
          var(--neon-magenta),
          transparent
        );
        z-index: -1;
        border-radius: 20px;
        animation: rotateBorder 4s linear infinite;
        opacity: 0.3;
      }

      @keyframes rotateBorder {
        0% {
          filter: hue-rotate(0deg);
        }
        100% {
          filter: hue-rotate(360deg);
        }
      }

      .form-header {
        background: rgba(0, 243, 255, 0.1);
        border-bottom: 1px solid var(--glass-border);
        color: white;
        padding: 24px;
        text-align: center;
      }

      .form-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        font-family: "Orbitron", sans-serif;
        letter-spacing: 0.1em;
        text-shadow: 0 0 20px var(--neon-cyan);
      }

      .form-subtitle {
        font-size: 16px;
        opacity: 0.8;
        color: rgba(255, 255, 255, 0.7);
      }

      .form-content {
        padding: 0;
      }

      /* Tabs */
      .form-tabs {
        display: flex;
        background: rgba(0, 243, 255, 0.05);
        border-bottom: 1px solid var(--glass-border);
      }

      .tab-button {
        flex: 1;
        padding: 16px 20px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.6);
        transition: all 0.3s ease;
        position: relative;
        font-family: "Rajdhani", sans-serif;
      }

      .tab-button:hover {
        background: rgba(0, 243, 255, 0.1);
        color: var(--neon-cyan);
      }

      .tab-button.active {
        color: var(--neon-cyan);
        background: var(--glass-bg);
        text-shadow: 0 0 10px var(--neon-cyan);
      }

      .tab-button.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--neon-cyan);
        box-shadow: 0 0 10px var(--neon-cyan);
      }

      /* Tab Content */
      .tab-content {
        display: none;
        padding: 32px;
      }

      .tab-content.active {
        display: block;
      }

      /* Form Fields */
      .form-section {
        margin-bottom: 32px;
      }

      .section-title {
        font-size: 18px;
        font-weight: 600;
        color: white;
        margin-bottom: 20px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--glass-border);
        font-family: "Orbitron", sans-serif;
        text-shadow: 0 0 10px var(--neon-cyan);
      }

      .form-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
        margin-bottom: 24px;
      }

      .form-field {
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .field-label {
        font-size: 14px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: "Rajdhani", sans-serif;
      }

      .field-required::after {
        content: '*';
        color: var(--neon-magenta);
        font-weight: 700;
        text-shadow: 0 0 10px var(--neon-magenta);
      }

      .field-input {
        padding: 12px 16px;
        border: 2px solid var(--glass-border);
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: rgba(10, 10, 25, 0.5);
        color: white;
        font-family: "Rajdhani", sans-serif;
      }

      .field-input:focus {
        outline: none;
        border-color: var(--neon-cyan);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        background: rgba(10, 10, 25, 0.7);
      }

      .field-input.error {
        border-color: var(--neon-magenta);
        box-shadow: 0 0 20px rgba(188, 19, 254, 0.3);
      }

      .field-input:disabled {
        background: rgba(10, 10, 25, 0.3);
        color: rgba(255, 255, 255, 0.4);
        cursor: not-allowed;
      }

      .field-textarea {
        min-height: 100px;
        resize: vertical;
      }

      .field-select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2300f3ff' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 12px center;
        background-repeat: no-repeat;
        background-size: 16px;
        padding-right: 40px;
      }

      .field-error {
        font-size: 12px;
        color: var(--neon-magenta);
        margin-top: 4px;
        display: none;
        text-shadow: 0 0 10px var(--neon-magenta);
      }

      .field-hint {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 4px;
      }

      /* Checkbox and Radio */
      .field-checkbox,
      .field-radio {
        flex-direction: row;
        align-items: center;
        gap: 12px;
      }

      .field-checkbox input,
      .field-radio input {
        width: auto;
        margin: 0;
      }

      .field-checkbox label,
      .field-radio label {
        margin: 0;
        font-weight: 400;
      }

      /* Form Actions */
      .form-actions {
        padding: 24px 32px;
        background: rgba(0, 243, 255, 0.05);
        border-top: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .action-buttons {
        display: flex;
        gap: 12px;
      }

      .btn {
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 2px solid transparent;
        font-family: "Orbitron", sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn-primary {
        background: transparent;
        color: var(--neon-cyan);
        border-color: var(--neon-cyan);
      }

      .btn-primary:hover {
        background: var(--neon-cyan);
        color: #000;
        box-shadow: 0 0 30px var(--neon-cyan);
      }

      .btn-secondary {
        background: transparent;
        color: rgba(255, 255, 255, 0.7);
        border-color: var(--glass-border);
      }

      .btn-secondary:hover {
        background: rgba(0, 243, 255, 0.1);
        border-color: var(--neon-cyan);
        color: var(--neon-cyan);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
      }

      .btn-danger {
        background: transparent;
        color: var(--neon-magenta);
        border-color: var(--neon-magenta);
      }

      .btn-danger:hover {
        background: var(--neon-magenta);
        color: #000;
        box-shadow: 0 0 30px var(--neon-magenta);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      /* Loading States */
      .loading-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Modal Styles */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        display: none;
      }

      .modal.show {
        display: flex;
      }

      .modal-content {
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 24px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .modal-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }

      .modal-icon.success {
        color: var(--neon-cyan);
        text-shadow: 0 0 20px var(--neon-cyan);
      }
      .modal-icon.error {
        color: var(--neon-magenta);
        text-shadow: 0 0 20px var(--neon-magenta);
      }
      .modal-icon.warning {
        color: var(--neon-cyan);
        text-shadow: 0 0 20px var(--neon-cyan);
      }

      .modal-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
        color: white;
        font-family: "Orbitron", sans-serif;
      }

      .modal-message {
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 24px;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .form-tabs {
          flex-direction: column;
        }

        .form-row {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .form-actions {
          flex-direction: column;
          gap: 16px;
        }

        .action-buttons {
          width: 100%;
          justify-content: center;
        }

        .btn {
          flex: 1;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Physics Layer -->
    <canvas id="quantum-canvas"></canvas>

    <!-- Success/Error Modal -->
    <div class="modal" id="messageModal">
      <div class="modal-content">
        <div class="modal-icon" id="modalIcon">
          <i class="fas fa-check-circle"></i>
        </div>
        <div class="modal-title" id="modalTitle">Success</div>
        <div class="modal-message" id="modalMessage">Data saved successfully</div>
        <button class="btn btn-primary" onclick="closeModal()">OK</button>
      </div>
    </div>

    <div class="form-container">
      <div class="form-header">
        <h1 class="form-title" id="formTitle">Add Employee Form</h1>
        <p class="form-subtitle" id="formSubtitle">Enter required data</p>
      </div>

      <form id="dynamicForm" class="form-content">
        <!-- Tabs will be generated dynamically -->
        <div id="formTabs" class="form-tabs"></div>

        <!-- Tab content will be generated dynamically -->
        <div id="tabContent" class="tab-content-container"></div>

        <!-- Form actions -->
        <div class="form-actions">
          <div class="action-buttons">
            <button type="button" class="btn btn-secondary" onclick="goBack()">
              <i class="fas fa-arrow-left"></i>
              Back
            </button>
            <button type="button" class="btn btn-danger" onclick="resetForm()">
              <i class="fas fa-undo"></i>
              Reset
            </button>
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span class="btn-text">Save</span>
            <div class="loading-spinner" style="display: none;"></div>
          </button>
        </div>
      </form>
    </div>

    <script>
      // Configuration
      const LOGGING = true;
      const PARTICLE_COUNT = 150;
      const CONNECTION_DISTANCE = 100;
      const MOUSE_RADIUS = 200;
      const SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

      // Global variables
      let formConfig = [];
      let currentTab = 0;
      let formData = {};
      let isEditMode = false;
      let recordId = null;

      // URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const formId = urlParams.get('form_id');
      const editId = urlParams.get('edit_id');

      // DOM Elements
      const dynamicForm = document.getElementById('dynamicForm');
      const formTabs = document.getElementById('formTabs');
      const tabContent = document.getElementById('tabContent');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = submitBtn.querySelector('.btn-text');
      const loadingSpinner = submitBtn.querySelector('.loading-spinner');

      // --- CANVAS SETUP ---
      const canvas = document.getElementById("quantum-canvas");
      const ctx = canvas.getContext("2d");
      let width, height;
      let particles = [];
      let mouse = { x: null, y: null };

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener("resize", resize);
      resize();

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
      });

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.z = Math.random() * 2 + 0.5;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.size = Math.random() * 2 + 1;
          this.color =
            Math.random() > 0.5 ? "rgba(0, 243, 255," : "rgba(188, 19, 254,";
        }

        update() {
          this.x += this.vx * this.z;
          this.y += this.vy * this.z;

          if (mouse.x != null) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < MOUSE_RADIUS) {
              const forceDirectionX = dx / distance;
              const forceDirectionY = dy / distance;
              const force = (MOUSE_RADIUS - distance) / MOUSE_RADIUS;
              this.x += forceDirectionX * force * 2 * -1;
              this.y += forceDirectionY * force * 2 * -1;
            }
          }

          if (this.x > width) this.x = 0;
          if (this.x < 0) this.x = width;
          if (this.y > height) this.y = 0;
          if (this.y < 0) this.y = height;
        }

        draw() {
          ctx.beginPath();
          let alpha = (this.z / 2.5) * 0.8;
          ctx.fillStyle = this.color + alpha + ")";
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }
      }

      function drawLines() {
        let opacityValue = 1;
        for (let a = 0; a < particles.length; a++) {
          for (let b = a; b < particles.length; b++) {
            let distance =
              (particles[a].x - particles[b].x) *
                (particles[a].x - particles[b].x) +
              (particles[a].y - particles[b].y) *
                (particles[a].y - particles[b].y);

            if (distance < CONNECTION_DISTANCE * CONNECTION_DISTANCE) {
              opacityValue = 1 - distance / 20000;
              ctx.strokeStyle = "rgba(0, 243, 255," + opacityValue * 0.2 + ")";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(particles[a].x, particles[a].y);
              ctx.lineTo(particles[b].x, particles[b].y);
              ctx.stroke();
            }
          }
        }
      }

      function animate() {
        ctx.fillStyle = "rgba(5, 5, 16, 0.5)";
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        drawLines();
        requestAnimationFrame(animate);
      }

      // Initialize
      document.addEventListener('DOMContentLoaded', function() {
        if (!formId) {
          showError('Form ID missing');
          return;
        }

        initParticles();
        animate();
        initializeForm();
      });

      async function initializeForm() {
        try {
          const sessionToken = localStorage.getItem('erp_session_token');
          if (!sessionToken) {
            window.location.href = 'Login.html';
            return;
          }

          await loadFormConfig();

          if (editId) {
            isEditMode = true;
            recordId = editId;
            await loadFormData();
            document.getElementById('formTitle').textContent = 'Edit Data';
            btnText.textContent = 'Update';
          }

          generateForm();

        } catch (error) {
          console.error('Form initialization error:', error);
          showError('Error loading form');
        }
      }

      async function loadFormConfig() {
        const bootstrapData = JSON.parse(localStorage.getItem('erp_bootstrap') || '{}');
        formConfig = bootstrapData.forms.filter(form => form.FORM_ID === formId);

        if (formConfig.length === 0) {
          throw new Error('Form configuration not found');
        }

        const tabs = {};
        formConfig.forEach(field => {
          if (!tabs[field.Tab_ID]) {
            tabs[field.Tab_ID] = {
              id: field.Tab_ID,
              label: field.Tab_Label,
              fields: []
            };
          }
          tabs[field.Tab_ID].fields.push(field);
        });

        formConfig = Object.values(tabs);
      }

      async function loadFormData() {
        const response = await apiCall('get_form_data', {
          session_token: localStorage.getItem('erp_session_token'),
          form_id: formId,
          record_id: recordId
        });

        if (response.success) {
          formData = response.data;
        }
      }

      function generateForm() {
        generateTabs();
        generateTabContent();
        dynamicForm.addEventListener('submit', handleFormSubmit);
        switchTab(0);
      }

      function generateTabs() {
        const tabsHtml = formConfig.map((tab, index) => `
          <button type="button" class="tab-button ${index === 0 ? 'active' : ''}" data-tab="${index}">
            ${tab.label}
          </button>
        `).join('');

        formTabs.innerHTML = tabsHtml;

        document.querySelectorAll('.tab-button').forEach((button, index) => {
          button.addEventListener('click', () => switchTab(index));
        });
      }

      function generateTabContent() {
        const contentHtml = formConfig.map((tab, index) => `
          <div class="tab-content ${index === 0 ? 'active' : ''}" data-tab="${index}">
            <div class="form-section">
              <h2 class="section-title">${tab.label}</h2>
              ${generateFields(tab.fields)}
            </div>
          </div>
        `).join('');

        tabContent.innerHTML = contentHtml;
      }

      function generateFields(fields) {
        const rows = [];
        let currentRow = [];

        fields.forEach(field => {
          currentRow.push(field);

          if (currentRow.length >= 2 || ['textarea', 'checkbox', 'radio'].includes(field.Field_Type)) {
            rows.push(currentRow);
            currentRow = [];
          }
        });

        if (currentRow.length > 0) {
          rows.push(currentRow);
        }

        return rows.map(row => `
          <div class="form-row">
            ${row.map(field => generateField(field)).join('')}
          </div>
        `).join('');
      }

      function generateField(field) {
        const fieldId = `field_${field.Field_ID}`;
        const isRequired = field.Is_Mandatory === true || field.Is_Mandatory === 'TRUE';
        const isDisabled = !field.Field_Can_Edit && isEditMode;
        const fieldValue = formData[field.Target_Column] || field.Default_Value || '';

        let fieldHtml = '';

        switch (field.Field_Type) {
          case 'text':
          case 'email':
          case 'tel':
          case 'number':
          case 'date':
            fieldHtml = `
              <div class="form-field">
                <label for="${fieldId}" class="field-label ${isRequired ? 'field-required' : ''}">
                  ${field.Field_Label}
                </label>
                <input
                  type="${field.Field_Type}"
                  id="${fieldId}"
                  name="${field.Field_ID}"
                  class="field-input"
                  value="${fieldValue}"
                  ${isRequired ? 'required' : ''}
                  ${isDisabled ? 'disabled' : ''}
                  placeholder="${field.Default_Value || ''}"
                >
                <div class="field-error" id="error_${fieldId}"></div>
              </div>
            `;
            break;

          case 'textarea':
            fieldHtml = `
              <div class="form-field">
                <label for="${fieldId}" class="field-label ${isRequired ? 'field-required' : ''}">
                  ${field.Field_Label}
                </label>
                <textarea
                  id="${fieldId}"
                  name="${field.Field_ID}"
                  class="field-input field-textarea"
                  ${isRequired ? 'required' : ''}
                  ${isDisabled ? 'disabled' : ''}
                  placeholder="${field.Default_Value || ''}"
                >${fieldValue}</textarea>
                <div class="field-error" id="error_${fieldId}"></div>
              </div>
            `;
            break;

          case 'dropdown':
            fieldHtml = `
              <div class="form-field">
                <label for="${fieldId}" class="field-label ${isRequired ? 'field-required' : ''}">
                  ${field.Field_Label}
                </label>
                <select
                  id="${fieldId}"
                  name="${field.Field_ID}"
                  class="field-input field-select"
                  ${isRequired ? 'required' : ''}
                  ${isDisabled ? 'disabled' : ''}
                >
                  <option value="">Select...</option>
                  ${generateDropdownOptions(field.DD_ID, fieldValue)}
                </select>
                <div class="field-error" id="error_${fieldId}"></div>
              </div>
            `;
            break;

          case 'checkbox':
            fieldHtml = `
              <div class="form-field field-checkbox">
                <input
                  type="checkbox"
                  id="${fieldId}"
                  name="${field.Field_ID}"
                  ${fieldValue ? 'checked' : ''}
                  ${isDisabled ? 'disabled' : ''}
                >
                <label for="${fieldId}" class="field-label">
                  ${field.Field_Label}
                </label>
              </div>
            `;
            break;

          default:
            fieldHtml = `
              <div class="form-field">
                <label class="field-label">${field.Field_Label}</label>
                <input
                  type="text"
                  class="field-input"
                  value="${fieldValue}"
                  disabled
                >
              </div>
            `;
        }

        return fieldHtml;
      }

      function generateDropdownOptions(ddId, selectedValue) {
        const bootstrapData = JSON.parse(localStorage.getItem('erp_bootstrap') || '{}');
        const dropdown = bootstrapData.dropdowns.find(dd => dd.DD_ID === ddId);

        if (!dropdown) return '<option value="">Options not available</option>';

        const options = {
          'DD_DEPARTMENTS': [
            { value: 'Quality', label: 'Quality' },
            { value: 'Finance', label: 'Finance' },
            { value: 'HR', label: 'HR' },
            { value: 'Projects', label: 'Projects' }
          ],
          'DD_JOB_TITLES': [
            { value: 'Engineer', label: 'Engineer' },
            { value: 'Accountant', label: 'Accountant' },
            { value: 'Manager', label: 'Manager' }
          ],
          'DD_EMPLOYEE_STATUS': [
            { value: 'Active', label: 'Active' },
            { value: 'Inactive', label: 'Inactive' }
          ]
        };

        const dropdownOptions = options[ddId] || [];
        return dropdownOptions.map(option =>
          `<option value="${option.value}" ${option.value === selectedValue ? 'selected' : ''}>${option.label}</option>`
        ).join('');
      }

      function switchTab(tabIndex) {
        document.querySelectorAll('.tab-button').forEach((button, index) => {
          button.classList.toggle('active', index === tabIndex);
        });

        document.querySelectorAll('.tab-content').forEach((content, index) => {
          content.classList.toggle('active', index === tabIndex);
        });

        currentTab = tabIndex;
      }

      async function handleFormSubmit(event) {
        event.preventDefault();

        if (!validateForm()) {
          return;
        }

        setFormLoading(true);

        try {
          const formData = new FormData(dynamicForm);
          const data = Object.fromEntries(formData);

          const response = await apiCall('save_form', {
            session_token: localStorage.getItem('erp_session_token'),
            form_id: formId,
            form_data: data,
            is_update: isEditMode
          });

          if (response.success) {
            showSuccess(response.message);
            setTimeout(() => {
              goBack();
            }, 2000);
          } else {
            showError(response.message);
          }

        } catch (error) {
          console.error('Form submission error:', error);
          showError('Error saving data');
        } finally {
          setFormLoading(false);
        }
      }

      function validateForm() {
        let isValid = true;

        document.querySelectorAll('.field-error').forEach(error => {
          error.style.display = 'none';
        });
        document.querySelectorAll('.field-input').forEach(input => {
          input.classList.remove('error');
        });

        formConfig.forEach(tab => {
          tab.fields.forEach(field => {
            const isRequired = field.Is_Mandatory === true || field.Is_Mandatory === 'TRUE';
            if (isRequired) {
              const input = document.getElementById(`field_${field.Field_ID}`);
              if (input && (!input.value || input.value.trim() === '')) {
                showFieldError(field.Field_ID, 'This field is required');
                isValid = false;
              }
            }
          });
        });

        return isValid;
      }

      function showFieldError(fieldId, message) {
        const errorElement = document.getElementById(`error_field_${fieldId}`);
        const inputElement = document.getElementById(`field_${fieldId}`);

        if (errorElement) {
          errorElement.textContent = message;
          errorElement.style.display = 'block';
        }

        if (inputElement) {
          inputElement.classList.add('error');
        }
      }

      async function apiCall(action, data) {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            action: action,
            data: data
          })
        });

        return await response.json();
      }

      function setFormLoading(loading) {
        submitBtn.disabled = loading;
        loadingSpinner.style.display = loading ? 'inline-block' : 'none';
        btnText.textContent = loading ? '' : (isEditMode ? 'Update' : 'Save');
      }

      function showSuccess(message) {
        showModal('success', 'Success', message);
      }

      function showError(message) {
        showModal('error', 'Error', message);
      }

      function showModal(type, title, message) {
        const modal = document.getElementById('messageModal');
        const icon = document.getElementById('modalIcon');
        const titleElement = document.getElementById('modalTitle');
        const messageElement = document.getElementById('modalMessage');

        icon.className = 'modal-icon';
        if (type === 'success') {
          icon.innerHTML = '<i class="fas fa-check-circle"></i>';
          icon.classList.add('success');
        } else if (type === 'error') {
          icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
          icon.classList.add('error');
        }

        titleElement.textContent = title;
        messageElement.textContent = message;

        modal.classList.add('show');
      }

      function closeModal() {
        document.getElementById('messageModal').classList.remove('show');
      }

      function goBack() {
        window.history.back();
      }

      function resetForm() {
        if (confirm('Are you sure you want to reset the form? All entered data will be lost.')) {
          dynamicForm.reset();
          document.querySelectorAll('.field-error').forEach(error => {
            error.style.display = 'none';
          });
          document.querySelectorAll('.field-input').forEach(input => {
            input.classList.remove('error');
          });
        }
      }

      window.goBack = goBack;
      window.resetForm = resetForm;
      window.closeModal = closeModal;
    </script>
  </body>
</html>
