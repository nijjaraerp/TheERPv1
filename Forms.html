<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نيجارا ERP - النماذج</title>

    <!-- Cairo Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #f8fafc;
            padding: 20px;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .form-content {
            padding: 0;
        }

        /* Tabs */
        .form-tabs {
            display: flex;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .tab-button {
            flex: 1;
            padding: 16px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-button:hover {
            background: #f3f4f6;
            color: #374151;
        }

        .tab-button.active {
            color: #4f46e5;
            background: white;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #4f46e5;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            padding: 32px;
        }

        .tab-content.active {
            display: block;
        }

        /* Form Fields */
        .form-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e5e7eb;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .field-label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-required::after {
            content: '*';
            color: #dc2626;
            font-weight: 700;
        }

        .field-input {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .field-input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .field-input.error {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .field-input:disabled {
            background: #f9fafb;
            color: #6b7280;
            cursor: not-allowed;
        }

        .field-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .field-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: left 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-left: 40px;
        }

        .field-error {
            font-size: 12px;
            color: #dc2626;
            margin-top: 4px;
            display: none;
        }

        .field-hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* Checkbox and Radio */
        .field-checkbox,
        .field-radio {
            flex-direction: row;
            align-items: center;
            gap: 12px;
        }

        .field-checkbox input,
        .field-radio input {
            width: auto;
            margin: 0;
        }

        .field-checkbox label,
        .field-radio label {
            margin: 0;
            font-weight: 400;
        }

        /* Form Actions */
        .form-actions {
            padding: 24px 32px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid transparent;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;
            color: #374151;
            border-color: #d1d5db;
        }

        .btn-secondary:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
        }

        .btn-danger:hover {
            background: #b91c1c;
            border-color: #b91c1c;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading States */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .modal-icon.success { color: #16a34a; }
        .modal-icon.error { color: #dc2626; }
        .modal-icon.warning { color: #d97706; }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #111827;
        }

        .modal-message {
            color: #6b7280;
            margin-bottom: 24px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-tabs {
                flex-direction: column;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .form-actions {
                flex-direction: column;
                gap: 16px;
            }

            .action-buttons {
                width: 100%;
                justify-content: center;
            }

            .btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Success/Error Modal -->
    <div class="modal" id="messageModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="modal-title" id="modalTitle">نجح</div>
            <div class="modal-message" id="modalMessage">تم حفظ البيانات بنجاح</div>
            <button class="btn btn-primary" onclick="closeModal()">موافق</button>
        </div>
    </div>

    <div class="form-container">
        <div class="form-header">
            <h1 class="form-title" id="formTitle">نموذج إضافة موظف</h1>
            <p class="form-subtitle" id="formSubtitle">أدخل البيانات المطلوبة</p>
        </div>

        <form id="dynamicForm" class="form-content">
            <!-- Tabs will be generated dynamically -->
            <div id="formTabs" class="form-tabs"></div>

            <!-- Tab content will be generated dynamically -->
            <div id="tabContent" class="tab-content-container"></div>

            <!-- Form actions -->
            <div class="form-actions">
                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" onclick="goBack()">
                        <i class="fas fa-arrow-right"></i>
                        رجوع
                    </button>
                    <button type="button" class="btn btn-danger" onclick="resetForm()">
                        <i class="fas fa-undo"></i>
                        إعادة تعيين
                    </button>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span class="btn-text">حفظ</span>
                    <div class="loading-spinner" style="display: none;"></div>
                </button>
            </div>
        </form>
    </div>

    <script>
        // Configuration
        const SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec'; // Replace with actual script URL

        // Global variables
        let formConfig = [];
        let currentTab = 0;
        let formData = {};
        let isEditMode = false;
        let recordId = null;

        // URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const formId = urlParams.get('form_id');
        const editId = urlParams.get('edit_id');

        // DOM Elements
        const dynamicForm = document.getElementById('dynamicForm');
        const formTabs = document.getElementById('formTabs');
        const tabContent = document.getElementById('tabContent');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = submitBtn.querySelector('.btn-text');
        const loadingSpinner = submitBtn.querySelector('.loading-spinner');

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (!formId) {
                showError('معرف النموذج مفقود');
                return;
            }

            initializeForm();
        });

        /**
         * Initialize the form
         */
        async function initializeForm() {
            try {
                setLoading(true);

                // Check authentication
                const sessionToken = localStorage.getItem('erp_session_token');
                if (!sessionToken) {
                    window.location.href = 'Login.html';
                    return;
                }

                // Load form configuration
                await loadFormConfig();

                // Check if edit mode
                if (editId) {
                    isEditMode = true;
                    recordId = editId;
                    await loadFormData();
                    document.getElementById('formTitle').textContent = 'تعديل البيانات';
                    btnText.textContent = 'تحديث';
                }

                // Generate form
                generateForm();

            } catch (error) {
                console.error('Form initialization error:', error);
                showError('خطأ في تحميل النموذج');
            } finally {
                setLoading(false);
            }
        }

        /**
         * Load form configuration from ENG_Forms
         */
        async function loadFormConfig() {
            const sessionToken = localStorage.getItem('erp_session_token');
            const bootstrapData = JSON.parse(localStorage.getItem('erp_bootstrap') || '{}');

            // Get form configuration from bootstrap data
            formConfig = bootstrapData.forms.filter(form => form.FORM_ID === formId);

            if (formConfig.length === 0) {
                throw new Error('Form configuration not found');
            }

            // Group by tabs
            const tabs = {};
            formConfig.forEach(field => {
                if (!tabs[field.Tab_ID]) {
                    tabs[field.Tab_ID] = {
                        id: field.Tab_ID,
                        label: field.Tab_Label,
                        fields: []
                    };
                }
                tabs[field.Tab_ID].fields.push(field);
            });

            formConfig = Object.values(tabs);
        }

        /**
         * Load existing form data for editing
         */
        async function loadFormData() {
            const response = await apiCall('get_form_data', {
                session_token: localStorage.getItem('erp_session_token'),
                form_id: formId,
                record_id: recordId
            });

            if (response.success) {
                formData = response.data;
            }
        }

        /**
         * Generate the complete form
         */
        function generateForm() {
            // Generate tabs
            generateTabs();

            // Generate tab content
            generateTabContent();

            // Set up form submission
            dynamicForm.addEventListener('submit', handleFormSubmit);

            // Switch to first tab
            switchTab(0);
        }

        /**
         * Generate form tabs
         */
        function generateTabs() {
            const tabsHtml = formConfig.map((tab, index) => `
                <button type="button" class="tab-button ${index === 0 ? 'active' : ''}" data-tab="${index}">
                    ${tab.label}
                </button>
            `).join('');

            formTabs.innerHTML = tabsHtml;

            // Add tab click handlers
            document.querySelectorAll('.tab-button').forEach((button, index) => {
                button.addEventListener('click', () => switchTab(index));
            });
        }

        /**
         * Generate tab content
         */
        function generateTabContent() {
            const contentHtml = formConfig.map((tab, index) => `
                <div class="tab-content ${index === 0 ? 'active' : ''}" data-tab="${index}">
                    <div class="form-section">
                        <h2 class="section-title">${tab.label}</h2>
                        ${generateFields(tab.fields)}
                    </div>
                </div>
            `).join('');

            tabContent.innerHTML = contentHtml;
        }

        /**
         * Generate form fields for a tab
         */
        function generateFields(fields) {
            // Group fields into rows
            const rows = [];
            let currentRow = [];

            fields.forEach(field => {
                currentRow.push(field);

                // Create new row every 2 fields or for special field types
                if (currentRow.length >= 2 || ['textarea', 'checkbox', 'radio'].includes(field.Field_Type)) {
                    rows.push(currentRow);
                    currentRow = [];
                }
            });

            if (currentRow.length > 0) {
                rows.push(currentRow);
            }

            return rows.map(row => `
                <div class="form-row">
                    ${row.map(field => generateField(field)).join('')}
                </div>
            `).join('');
        }

        /**
         * Generate individual field
         */
        function generateField(field) {
            const fieldId = `field_${field.Field_ID}`;
            const isRequired = field.Is_Mandatory === true || field.Is_Mandatory === 'TRUE';
            const isDisabled = !field.Field_Can_Edit && isEditMode;
            const fieldValue = formData[field.Target_Column] || field.Default_Value || '';

            let fieldHtml = '';

            switch (field.Field_Type) {
                case 'text':
                case 'email':
                case 'tel':
                case 'number':
                case 'date':
                    fieldHtml = `
                        <div class="form-field">
                            <label for="${fieldId}" class="field-label ${isRequired ? 'field-required' : ''}">
                                ${field.Field_Label}
                            </label>
                            <input
                                type="${field.Field_Type}"
                                id="${fieldId}"
                                name="${field.Field_ID}"
                                class="field-input"
                                value="${fieldValue}"
                                ${isRequired ? 'required' : ''}
                                ${isDisabled ? 'disabled' : ''}
                                placeholder="${field.Default_Value || ''}"
                            >
                            <div class="field-error" id="error_${fieldId}"></div>
                        </div>
                    `;
                    break;

                case 'textarea':
                    fieldHtml = `
                        <div class="form-field">
                            <label for="${fieldId}" class="field-label ${isRequired ? 'field-required' : ''}">
                                ${field.Field_Label}
                            </label>
                            <textarea
                                id="${fieldId}"
                                name="${field.Field_ID}"
                                class="field-input field-textarea"
                                ${isRequired ? 'required' : ''}
                                ${isDisabled ? 'disabled' : ''}
                                placeholder="${field.Default_Value || ''}"
                            >${fieldValue}</textarea>
                            <div class="field-error" id="error_${fieldId}"></div>
                        </div>
                    `;
                    break;

                case 'dropdown':
                    fieldHtml = `
                        <div class="form-field">
                            <label for="${fieldId}" class="field-label ${isRequired ? 'field-required' : ''}">
                                ${field.Field_Label}
                            </label>
                            <select
                                id="${fieldId}"
                                name="${field.Field_ID}"
                                class="field-input field-select"
                                ${isRequired ? 'required' : ''}
                                ${isDisabled ? 'disabled' : ''}
                            >
                                <option value="">اختر...</option>
                                ${generateDropdownOptions(field.DD_ID, fieldValue)}
                            </select>
                            <div class="field-error" id="error_${fieldId}"></div>
                        </div>
                    `;
                    break;

                case 'checkbox':
                    fieldHtml = `
                        <div class="form-field field-checkbox">
                            <input
                                type="checkbox"
                                id="${fieldId}"
                                name="${field.Field_ID}"
                                ${fieldValue ? 'checked' : ''}
                                ${isDisabled ? 'disabled' : ''}
                            >
                            <label for="${fieldId}" class="field-label">
                                ${field.Field_Label}
                            </label>
                        </div>
                    `;
                    break;

                default:
                    fieldHtml = `
                        <div class="form-field">
                            <label class="field-label">${field.Field_Label}</label>
                            <input
                                type="text"
                                class="field-input"
                                value="${fieldValue}"
                                disabled
                            >
                        </div>
                    `;
            }

            return fieldHtml;
        }

        /**
         * Generate dropdown options
         */
        function generateDropdownOptions(ddId, selectedValue) {
            // This would load from bootstrap data dropdowns
            const bootstrapData = JSON.parse(localStorage.getItem('erp_bootstrap') || '{}');
            const dropdown = bootstrapData.dropdowns.find(dd => dd.DD_ID === ddId);

            if (!dropdown) return '<option value="">خيارات غير متوفرة</option>';

            // For demo purposes, return sample options
            // In production, this would be loaded from DD_* sheets
            const options = {
                'DD_DEPARTMENTS': [
                    { value: 'الجودة', label: 'الجودة' },
                    { value: 'المالية', label: 'المالية' },
                    { value: 'الموارد البشرية', label: 'الموارد البشرية' },
                    { value: 'المشاريع', label: 'المشاريع' }
                ],
                'DD_JOB_TITLES': [
                    { value: 'مهندس', label: 'مهندس' },
                    { value: 'محاسب', label: 'محاسب' },
                    { value: 'مدير', label: 'مدير' }
                ],
                'DD_EMPLOYEE_STATUS': [
                    { value: 'نشط', label: 'نشط' },
                    { value: 'غير نشط', label: 'غير نشط' }
                ]
            };

            const dropdownOptions = options[ddId] || [];
            return dropdownOptions.map(option =>
                `<option value="${option.value}" ${option.value === selectedValue ? 'selected' : ''}>${option.label}</option>`
            ).join('');
        }

        /**
         * Switch between tabs
         */
        function switchTab(tabIndex) {
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach((button, index) => {
                button.classList.toggle('active', index === tabIndex);
            });

            // Update tab content
            document.querySelectorAll('.tab-content').forEach((content, index) => {
                content.classList.toggle('active', index === tabIndex);
            });

            currentTab = tabIndex;
        }

        /**
         * Handle form submission
         */
        async function handleFormSubmit(event) {
            event.preventDefault();

            if (!validateForm()) {
                return;
            }

            setFormLoading(true);

            try {
                const formData = new FormData(dynamicForm);
                const data = Object.fromEntries(formData);

                const response = await apiCall('save_form', {
                    session_token: localStorage.getItem('erp_session_token'),
                    form_id: formId,
                    form_data: data,
                    is_update: isEditMode
                });

                if (response.success) {
                    showSuccess(response.message);
                    setTimeout(() => {
                        goBack();
                    }, 2000);
                } else {
                    showError(response.message);
                }

            } catch (error) {
                console.error('Form submission error:', error);
                showError('خطأ في حفظ البيانات');
            } finally {
                setFormLoading(false);
            }
        }

        /**
         * Validate form
         */
        function validateForm() {
            let isValid = true;

            // Clear previous errors
            document.querySelectorAll('.field-error').forEach(error => {
                error.style.display = 'none';
            });
            document.querySelectorAll('.field-input').forEach(input => {
                input.classList.remove('error');
            });

            // Validate required fields
            formConfig.forEach(tab => {
                tab.fields.forEach(field => {
                    const isRequired = field.Is_Mandatory === true || field.Is_Mandatory === 'TRUE';
                    if (isRequired) {
                        const input = document.getElementById(`field_${field.Field_ID}`);
                        if (input && (!input.value || input.value.trim() === '')) {
                            showFieldError(field.Field_ID, 'هذا الحقل مطلوب');
                            isValid = false;
                        }
                    }
                });
            });

            return isValid;
        }

        /**
         * Show field error
         */
        function showFieldError(fieldId, message) {
            const errorElement = document.getElementById(`error_field_${fieldId}`);
            const inputElement = document.getElementById(`field_${fieldId}`);

            if (errorElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }

            if (inputElement) {
                inputElement.classList.add('error');
            }
        }

        /**
         * API call helper
         */
        async function apiCall(action, data) {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: action,
                    data: data
                })
            });

            return await response.json();
        }

        /**
         * Set form loading state
         */
        function setFormLoading(loading) {
            submitBtn.disabled = loading;
            loadingSpinner.style.display = loading ? 'inline-block' : 'none';
            btnText.textContent = loading ? '' : (isEditMode ? 'تحديث' : 'حفظ');
        }

        /**
         * Set general loading state
         */
        function setLoading(loading) {
            // Could add a loading overlay here
        }

        /**
         * Show success message
         */
        function showSuccess(message) {
            showModal('success', 'نجح', message);
        }

        /**
         * Show error message
         */
        function showError(message) {
            showModal('error', 'خطأ', message);
        }

        /**
         * Show modal
         */
        function showModal(type, title, message) {
            const modal = document.getElementById('messageModal');
            const icon = document.getElementById('modalIcon');
            const titleElement = document.getElementById('modalTitle');
            const messageElement = document.getElementById('modalMessage');

            // Set icon
            icon.className = 'modal-icon';
            if (type === 'success') {
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                icon.classList.add('success');
            } else if (type === 'error') {
                icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
                icon.classList.add('error');
            }

            titleElement.textContent = title;
            messageElement.textContent = message;

            modal.classList.add('show');
        }

        /**
         * Close modal
         */
        function closeModal() {
            document.getElementById('messageModal').classList.remove('show');
        }

        /**
         * Go back to previous page
         */
        function goBack() {
            window.history.back();
        }

        /**
         * Reset form
         */
        function resetForm() {
            if (confirm('هل أنت متأكد من إعادة تعيين النموذج؟ ستفقد جميع البيانات المدخلة.')) {
                dynamicForm.reset();
                // Clear validation errors
                document.querySelectorAll('.field-error').forEach(error => {
                    error.style.display = 'none';
                });
                document.querySelectorAll('.field-input').forEach(input => {
                    input.classList.remove('error');
                });
            }
        }

        // Global functions for external access
        window.goBack = goBack;
        window.resetForm = resetForm;
        window.closeModal = closeModal;
    </script>
</body>
</html>
