<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nijjara ERP - تسجيل الدخول</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/nijjara-theme.css" />
    <style>
      .glass-stack {
        pointer-events: none;
        text-align: center;
      }

      .glass-card h1 {
        color: var(--color-text);
        margin-bottom: 10px;
      }

      .glass-card p {
        color: var(--color-text-muted);
        line-height: 1.8;
      }

      .glass-card .badge-row {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      .glass-card .badge {
        border: 1px solid var(--color-border-glass);
        border-radius: 999px;
        padding: 8px 18px;
        color: var(--color-accent-secondary);
        font-size: 0.9rem;
        background: rgba(255, 255, 255, 0.04);
      }

      .login-box form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .login-box label {
        color: var(--color-text-muted);
        font-size: 0.9rem;
        margin-bottom: 4px;
      }

      .login-box .field {
        display: flex;
        flex-direction: column;
      }

      .loading {
        color: var(--color-text-muted);
        text-align: center;
        font-size: 0.85rem;
        margin-top: 8px;
      }
    </style>
  </head>
  <body class="nijjara-body">

          <circle cx="9" cy="7" r="4"></circle>

          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </symbol>
        <symbol

          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"

          ></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>

        <symbol

        >
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </symbol>
        <symbol
          id="icon-sys"

          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"

        >

        </symbol>
        <symbol
          id="icon-grid"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </symbol>
        <symbol
          id="icon-layers"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>

        <symbol

          ></path>
        </symbol>
        <symbol
          id="icon-restore"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"

          <circle cx="12" cy="12" r="3"></circle>
        </symbol>
        <symbol
          id="icon-plus"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </symbol>
        <symbol
          id="icon-search"
          viewBox="0 0 24 24"
          fill="none"

          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

        <symbol
          id="icon-minus"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"

    </svg>

    <div id="boot-screen">
      <div id="boot-log"></div>
      <div class="login-box" id="login-box">
        <h2>Nijjara ERP sys</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="field">
            <label for="username">اسم المستخدم</label>
            <input
              type="text"
              id="username"
              placeholder="اسم المستخدم"
              required
            />
          </div>
          <div class="field">
            <label for="password">كلمة السر</label>
            <input
              type="password"
              id="password"
              placeholder="******"
              required
            />
          </div>
          <button type="submit" id="loginBtn">تسجيل الدخول</button>
          <div id="login-feedback"></div>
          <div id="loading" class="loading" style="display: none">
            جاري التحقق...
          </div>
        </form>
      </div>
    </div>

    <div id="nijjara-os" aria-hidden="true">
      <div id="holo-deck"><div id="particles"></div></div>
      <div id="status-bar">
        <div id="user-info">USER: ...</div>
        <div id="date-time">Loading clock...</div>
      </div>
      <div id="task-switcher"></div>
      <div id="neural-dock">
        <div class="dock-group window-mgmt">
          <div class="dock-app" id="app-grid" data-title="ترتيب شبكي">
            <div class="dock-app-icon">
              <svg><use href="#icon-grid"></use></svg>
            </div>
            <div class="dock-app-label">شبكي</div>
          </div>
          <div class="dock-app" id="app-cascade" data-title="ترتيب متتالي">
            <div class="dock-app-icon">
              <svg><use href="#icon-layers"></use></svg>
            </div>
            <div class="dock-app-label">متتالي</div>
          </div>
        </div>
        <div class="dock-group modules">
          <div
            class="dock-app"
            data-title="يتطلّب تسجيل الدخول"
            onclick="NijjaraShell.showToast('سجّل الدخول أولاً', 'info')"
          >
            <div class="dock-app-icon">
              <svg><use href="#icon-hrm"></use></svg>
            </div>
            <div class="dock-app-label">الموارد</div>
          </div>
          <div
            class="dock-app"
            data-title="يتطلّب تسجيل الدخول"
            onclick="NijjaraShell.showToast('سجّل الدخول أولاً', 'info')"
          >
            <div class="dock-app-icon">
              <svg><use href="#icon-prj"></use></svg>
            </div>
            <div class="dock-app-label">المشاريع</div>
          </div>
          <div
            class="dock-app"
            data-title="يتطلّب تسجيل الدخول"
            onclick="NijjaraShell.showToast('سجّل الدخول أولاً', 'info')"
          >
            <div class="dock-app-icon">
              <svg><use href="#icon-fin"></use></svg>
            </div>
            <div class="dock-app-label">المالية</div>
          </div>
        </div>
        <div
          class="dock-app"
          id="app-shutdown"
          data-title="إعادة تشغيل"
          style="color: var(--color-accent-red)"
          onclick="location.reload()"
        >
          <div class="dock-app-icon">
            <svg style="stroke: var(--color-accent-red)">
              <use href="#icon-power"></use>
            </svg>
          </div>
          <div class="dock-app-label" style="color: var(--color-accent-red)">
            خروج
          </div>
        </div>
      </div>

      <div class="glass-stack">
        <section class="glass-card">
          <h1>نظام تشغيل Nijjara-OS</h1>
          <p>
            كل من وحدات الموارد، المشاريع، والمالية تعمل الآن داخل تجربة زجاجية
            موحّدة. ابدأ تسجيل الدخول لتشغيل جلسة عملك الميتاداتية.
          </p>
          <div class="badge-row">
            <span class="badge">جلسات مشفّرة</span>
            <span class="badge">تحكم فوري</span>
            <span class="badge">تصميم زجاجي</span>
          </div>
        </section>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <template id="task-thumb-template">
      <div class="task-thumb">
        <div class="task-thumb-icon">
          <svg><use href="#icon-sys"></use></svg>
        </div>
        <span class="task-thumb-title">Window</span>
      </div>
    </template>

    <script src="assets/js/nijjara-shell.js"></script>
    <script>
      const bootMessages = [
        "BOOTING NIJJARA-OS v1.0...",
        "Loading kernel modules... OK",
        "Initializing 3D glass display... DONE",
        "Connecting to neural-link... SECURE",
        "Loading user authentication service...",
        "Awaiting system key...",
      ];

      document.addEventListener("DOMContentLoaded", () => {
        NijjaraShell.init();
        NijjaraShell.bootSequence(bootMessages, "#boot-log", () => {
          document.getElementById("login-box").style.display = "flex";
        });
      });

      function revealShell(user) {
        const bootScreen = document.getElementById("boot-screen");
        bootScreen.style.opacity = "0";
        bootScreen.style.visibility = "hidden";
        const shell = document.getElementById("nijjara-os");
        shell.style.display = "block";
        document.getElementById("user-info").textContent = `USER: ${user}`;
      }

      function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const feedback = document.getElementById("login-feedback");
        const loadingEl = document.getElementById("loading");
        const btnEl = document.getElementById("loginBtn");

        if (!username || !password) {
          NijjaraShell.showToast("يرجى تعبئة كل الحقول", "error");
          return;
        }

        feedback.textContent = "";
        loadingEl.style.display = "block";
        btnEl.disabled = true;

        google.script.run
          .withSuccessHandler(function (response) {
            loadingEl.style.display = "none";
            btnEl.disabled = false;

            if (response.success) {
              revealShell(username);
              NijjaraShell.showToast(
                response.message || "تم تسجيل الدخول",
                "success"
              );
              sessionStorage.setItem("sessionToken", response.token);
              sessionStorage.setItem("user", JSON.stringify(response.user));
              sessionStorage.setItem("flashMessage", "تم تسجيل الدخول بنجاح");
              sessionStorage.setItem("flashType", "success");

              setTimeout(function () {
                google.script.run
                  .withSuccessHandler(function (html) {
                    document.body.innerHTML = html;
                  })
                  .getDashboard();
              }, 600);
            } else {
              feedback.textContent = response.message || "تعذر تسجيل الدخول";
              NijjaraShell.showToast(
                response.message || "تعذر تسجيل الدخول",
                "error"
              );
            }
          })
          .withFailureHandler(function (error) {
            loadingEl.style.display = "none";
            btnEl.disabled = false;
            const msg = "حدث خطأ في الاتصال";
            feedback.textContent = msg;
            NijjaraShell.showToast(`${msg}: ${error.message}`, "error");
          })
          .doLogin(username, password);
      }

      console.log("[LOGIN PAGE] Ready");
    </script>
  </body>
</html>
