<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nijjara ERP - تسجيل الدخول</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
      padding: 20px;
    }
    
    .login-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      max-width: 450px;
      width: 100%;
      animation: slideUp 0.5s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .login-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }
    
    .login-header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .login-header p {
      font-size: 16px;
      opacity: 0.9;
      font-weight: 300;
    }
    
    .login-body {
      padding: 40px 30px;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Cairo', sans-serif;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-group input::placeholder {
      color: #999;
      font-weight: 300;
    }
    
    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    
    .btn-login:active {
      transform: translateY(0);
    }
    
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease-out;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .alert-error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }
    
    .alert-success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }
    
    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    .login-footer {
      text-align: center;
      padding: 20px;
      background: #f8f9fa;
      color: #666;
      font-size: 13px;
    }
    
    .password-toggle {
      position: relative;
    }
    
    .password-toggle-btn {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 18px;
      padding: 5px;
    }
    
    .password-toggle-btn:hover {
      color: #667eea;
    }
    
    @media (max-width: 480px) {
      .login-container {
        border-radius: 0;
      }
      
      .login-header h1 {
        font-size: 26px;
      }
      
      .login-body {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <h1>نظام Nijjara ERP</h1>
    <p>نظام إدارة موارد المؤسسة</p>
  </div>
  
  <div class="login-body">
    <div id="alertBox" class="alert"></div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="أدخل اسم المستخدم"
          required
          autocomplete="username"
        >
      </div>
      
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <div class="password-toggle">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="أدخل كلمة المرور"
            required
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle-btn" onclick="togglePassword()">
            <span id="toggleIcon">👁️</span>
          </button>
        </div>
      </div>
      
      <button type="submit" class="btn-login" id="loginBtn">
        <span id="loginText">تسجيل الدخول</span>
        <div class="loading-spinner" id="spinner"></div>
      </button>
    </form>
  </div>
  
  <div class="login-footer">
    <p>© 2024 Nijjara ERP - جميع الحقوق محفوظة</p>
  </div>
</div>

<script>
  /**
   * Toggle password visibility
   */
  function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.textContent = '🙈';
    } else {
      passwordInput.type = 'password';
      toggleIcon.textContent = '👁️';
    }
  }
  
  /**
   * Show alert message
   */
  function showAlert(message, type = 'error') {
    const alertBox = document.getElementById('alertBox');
    alertBox.textContent = message;
    alertBox.className = `alert alert-${type}`;
    alertBox.style.display = 'block';
    
    // Auto-hide after 5 seconds
    setTimeout(() => {
      alertBox.style.display = 'none';
    }, 5000);
  }
  
  /**
   * Set loading state
   */
  function setLoading(isLoading) {
    const loginBtn = document.getElementById('loginBtn');
    const loginText = document.getElementById('loginText');
    const spinner = document.getElementById('spinner');
    
    if (isLoading) {
      loginBtn.disabled = true;
      loginText.style.display = 'none';
      spinner.style.display = 'block';
    } else {
      loginBtn.disabled = false;
      loginText.style.display = 'block';
      spinner.style.display = 'none';
    }
  }
  
  /**
   * Handle login form submission
   */
  function handleLogin(event) {
    event.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    
    // Validation
    if (!username || !password) {
      showAlert('يرجى إدخال اسم المستخدم وكلمة المرور');
      return;
    }
    
    setLoading(true);
    
    // Call backend authentication
    google.script.run
      .withSuccessHandler(onLoginSuccess)
      .withFailureHandler(onLoginFailure)
      .authenticateUser(username, password);
  }
  
  /**
   * Handle successful login
   */
  function onLoginSuccess(response) {
    setLoading(false);
    
    if (response.success) {
      // Store session data
      sessionStorage.setItem('authToken', response.token);
      sessionStorage.setItem('userId', response.userId);
      sessionStorage.setItem('userName', response.userName);
      sessionStorage.setItem('roleId', response.roleId);
      sessionStorage.setItem('bootstrap', JSON.stringify(response.bootstrap));
      
      showAlert('تم تسجيل الدخول بنجاح!', 'success');
      
      // Redirect to dashboard
      setTimeout(() => {
        google.script.run
          .withSuccessHandler((url) => {
            window.location.href = url + '?page=dashboard';
          })
          .getScriptUrl();
      }, 1000);
      
    } else {
      showAlert(response.message || 'فشل تسجيل الدخول');
    }
  }
  
  /**
   * Handle login failure
   */
  function onLoginFailure(error) {
    setLoading(false);
    console.error('Login error:', error);
    showAlert('حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.');
  }
  
  /**
   * Auto-focus username field on load
   */
  window.addEventListener('load', () => {
    document.getElementById('username').focus();
  });
  
  /**
   * Check if already logged in
   */
  window.addEventListener('load', () => {
    const token = sessionStorage.getItem('authToken');
    if (token) {
      // Verify token is still valid
      google.script.run
        .withSuccessHandler((session) => {
          if (session) {
            google.script.run
              .withSuccessHandler((url) => {
                window.location.href = url + '?page=dashboard';
              })
              .getScriptUrl();
          }
        })
        .withFailureHandler(() => {
          // Token invalid, clear storage
          sessionStorage.clear();
        })
        .verifySession(token);
    }
  });
</script>

</body>
</html>
