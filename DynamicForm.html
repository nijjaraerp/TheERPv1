<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الموارد - نماذج ديناميكية</title>
    <style>
        /* Dynamic Form Styles */
        .dynamic-form-container {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .form-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-tab {
            flex: 1;
            padding: 15px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }

        .form-tab:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .form-tab.active {
            background: rgba(74, 144, 226, 0.3);
            border-bottom: 3px solid #4a90e2;
        }

        .form-tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .form-tab-content.active {
            display: block;
        }

        .form-field {
            margin-bottom: 20px;
            position: relative;
        }

        .form-field-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffffff;
            font-size: 14px;
        }

        .form-field-required {
            color: #ff6b6b;
            margin-right: 4px;
        }

        .form-field-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-field-input:focus {
            outline: none;
            border-color: #4a90e2;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.3);
        }

        .form-field-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }

        .form-field-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            cursor: pointer;
        }

        .form-field-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-field-error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .form-field-error.show {
            display: block;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-btn-primary {
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }

        .form-btn-primary:hover {
            background: linear-gradient(135deg, #357abd 0%, #2968a3 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }

        .form-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .form-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .form-loading {
            text-align: center;
            padding: 40px;
            color: #ffffff;
        }

        .form-loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #4a90e2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .form-error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #ff6b6b;
            text-align: center;
        }

        .form-success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #4caf50;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .dynamic-form-container {
                padding: 10px;
            }
            
            .form-tabs {
                flex-direction: column;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .form-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="dynamicFormContainer" class="dynamic-form-container">
        <!-- Form will be dynamically loaded here -->
        <div class="form-loading">
            <div class="form-loading-spinner"></div>
            <p>جاري تحميل النموذج...</p>
        </div>
    </div>

    <script>
        // Dynamic Form JavaScript
        class DynamicForm {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.formConfig = null;
                this.formData = {};
                this.validationRules = {};
                this.currentTab = 0;
            }

            /**
             * Initialize the dynamic form
             */
            async initialize(formId, context = {}) {
                try {
                    this.showLoading();
                    
                    // Load form configuration from server
                    const response = await this.loadFormConfiguration(formId, context);
                    if (!response.success) {
                        throw new Error(response.error || 'Failed to load form configuration');
                    }
                    
                    this.formConfig = response.form;
                    this.validationRules = response.metadata?.validationRules || {};
                    
                    // Render the form
                    this.renderForm();
                    
                    // Setup event listeners
                    this.setupEventListeners();
                    
                    console.log('Dynamic form initialized successfully');
                } catch (error) {
                    console.error('Failed to initialize dynamic form:', error);
                    this.showError('فشل في تحميل النموذج: ' + error.message);
                }
            }

            /**
             * Load form configuration from server
             */
            async loadFormConfiguration(formId, context) {
                return new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .generateDynamicForm(formId, context);
                });
            }

            /**
             * Render the form
             */
            renderForm() {
                if (!this.formConfig) {
                    throw new Error('Form configuration not loaded');
                }

                const html = `
                    <div class="form-header">
                        <h2 class="form-title">${this.escapeHtml(this.formConfig.formLabel || 'نموذج ديناميكي')}</h2>
                        <p class="form-description">${this.escapeHtml(this.formConfig.description || '')}</p>
                    </div>
                    
                    ${this.renderTabs()}
                    
                    <div class="form-content">
                        ${this.renderTabContents()}
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="form-btn form-btn-secondary" id="formCancelBtn">إلغاء</button>
                        <button type="button" class="form-btn form-btn-primary" id="formSubmitBtn">حفظ</button>
                    </div>
                `;

                this.container.innerHTML = html;
            }

            /**
             * Render form tabs
             */
            renderTabs() {
                if (!this.formConfig.tabs || this.formConfig.tabs.length === 0) {
                    return '';
                }

                const tabsHtml = this.formConfig.tabs.map((tab, index) => `
                    <button type="button" class="form-tab ${index === 0 ? 'active' : ''}" data-tab-index="${index}">
                        ${this.escapeHtml(tab.tabLabel || 'Tab ' + (index + 1))}
                    </button>
                `).join('');

                return `<div class="form-tabs">${tabsHtml}</div>`;
            }

            /**
             * Render tab contents
             */
            renderTabContents() {
                if (!this.formConfig.tabs || this.formConfig.tabs.length === 0) {
                    return this.renderFields(this.formConfig.fields || []);
                }

                return this.formConfig.tabs.map((tab, index) => `
                    <div class="form-tab-content ${index === 0 ? 'active' : ''}" data-tab-index="${index}">
                        ${this.renderFields(tab.fields || [])}
                    </div>
                `).join('');
            }

            /**
             * Render form fields
             */
            renderFields(fields) {
                if (!fields || fields.length === 0) {
                    return '<p>لا توجد حقول لعرضها</p>';
                }

                return fields.map(field => this.renderField(field)).join('');
            }

            /**
             * Render individual field
             */
            renderField(field) {
                const fieldId = `field_${field.fieldId}`;
                const isRequired = field.isMandatory ? '<span class="form-field-required">*</span>' : '';
                
                let inputHtml = '';
                
                switch (field.fieldType) {
                    case 'text':
                    case 'number':
                    case 'email':
                    case 'tel':
                    case 'date':
                        inputHtml = `<input type="${field.fieldType}" id="${fieldId}" class="form-field-input" placeholder="${this.escapeHtml(field.defaultValue || '')}" ${field.isMandatory ? 'required' : ''}>`;
                        break;
                    case 'textarea':
                        inputHtml = `<textarea id="${fieldId}" class="form-field-input form-field-textarea" placeholder="${this.escapeHtml(field.defaultValue || '')}" ${field.isMandatory ? 'required' : ''}></textarea>`;
                        break;
                    case 'select':
                        inputHtml = this.renderSelectField(field, fieldId);
                        break;
                    case 'checkbox':
                        inputHtml = `<input type="checkbox" id="${fieldId}" class="form-field-checkbox">`;
                        break;
                    case 'radio':
                        inputHtml = this.renderRadioField(field, fieldId);
                        break;
                    default:
                        inputHtml = `<input type="text" id="${fieldId}" class="form-field-input" placeholder="${this.escapeHtml(field.defaultValue || '')}" ${field.isMandatory ? 'required' : ''}>`;
                }

                return `
                    <div class="form-field" data-field-id="${field.fieldId}">
                        <label for="${fieldId}" class="form-field-label">
                            ${this.escapeHtml(field.fieldLabel || '')}${isRequired}
                        </label>
                        ${inputHtml}
                        <div class="form-field-error" id="${fieldId}_error"></div>
                    </div>
                `;
            }

            /**
             * Render select field
             */
            renderSelectField(field, fieldId) {
                // TODO: Load dropdown options from server
                const options = [
                    { value: '', text: '-- اختر --' },
                    { value: 'option1', text: 'خيار 1' },
                    { value: 'option2', text: 'خيار 2' }
                ];

                const optionsHtml = options.map(opt => 
                    `<option value="${this.escapeHtml(opt.value)}">${this.escapeHtml(opt.text)}</option>`
                ).join('');

                return `<select id="${fieldId}" class="form-field-select" ${field.isMandatory ? 'required' : ''}>${optionsHtml}</select>`;
            }

            /**
             * Render radio field
             */
            renderRadioField(field, fieldId) {
                // TODO: Load radio options from server
                const options = [
                    { value: 'option1', text: 'خيار 1' },
                    { value: 'option2', text: 'خيار 2' }
                ];

                return options.map((opt, index) => `
                    <label style="margin-left: 15px;">
                        <input type="radio" name="${fieldId}" value="${this.escapeHtml(opt.value)}">
                        ${this.escapeHtml(opt.text)}
                    </label>
                `).join('');
            }

            /**
             * Setup event listeners
             */
            setupEventListeners() {
                // Tab switching
                document.querySelectorAll('.form-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        this.switchTab(parseInt(e.target.dataset.tabIndex));
                    });
                });

                // Form submission
                document.getElementById('formSubmitBtn').addEventListener('click', () => {
                    this.submitForm();
                });

                // Form cancellation
                document.getElementById('formCancelBtn').addEventListener('click', () => {
                    this.cancelForm();
                });

                // Field validation
                document.querySelectorAll('.form-field-input, .form-field-select, .form-field-textarea').forEach(field => {
                    field.addEventListener('blur', () => {
                        this.validateField(field);
                    });
                });
            }

            /**
             * Switch between tabs
             */
            switchTab(tabIndex) {
                // Update tab active state
                document.querySelectorAll('.form-tab').forEach((tab, index) => {
                    tab.classList.toggle('active', index === tabIndex);
                });

                // Update content active state
                document.querySelectorAll('.form-tab-content').forEach((content, index) => {
                    content.classList.toggle('active', index === tabIndex);
                });

                this.currentTab = tabIndex;
            }

            /**
             * Validate individual field
             */
            validateField(field) {
                const fieldId = field.id;
                const fieldConfig = this.getFieldConfig(fieldId);
                const errorElement = document.getElementById(fieldId + '_error');
                
                let isValid = true;
                let errorMessage = '';

                // Required field validation
                if (fieldConfig && fieldConfig.isMandatory && !field.value.trim()) {
                    isValid = false;
                    errorMessage = 'هذا الحقل مطلوب';
                }

                // Type validation
                if (isValid && field.value && field.type === 'email') {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(field.value)) {
                        isValid = false;
                        errorMessage = 'يرجى إدخال بريد إلكتروني صحيح';
                    }
                }

                // Custom validation rules
                if (isValid && this.validationRules[fieldId]) {
                    const rule = this.validationRules[fieldId];
                    if (rule.minLength && field.value.length < rule.minLength) {
                        isValid = false;
                        errorMessage = `الحد الأدنى للطول هو ${rule.minLength} حرف`;
                    }
                    if (rule.maxLength && field.value.length > rule.maxLength) {
                        isValid = false;
                        errorMessage = `الحد الأقصى للطول هو ${rule.maxLength} حرف`;
                    }
                    if (rule.pattern && !new RegExp(rule.pattern).test(field.value)) {
                        isValid = false;
                        errorMessage = rule.patternMessage || 'الصيغة غير صحيحة';
                    }
                }

                // Update UI
                if (errorElement) {
                    errorElement.textContent = errorMessage;
                    errorElement.classList.toggle('show', !isValid);
                    field.classList.toggle('error', !isValid);
                }

                return isValid;
            }

            /**
             * Get field configuration
             */
            getFieldConfig(fieldId) {
                const cleanFieldId = fieldId.replace('field_', '');
                
                // Search in all tabs
                if (this.formConfig.tabs) {
                    for (const tab of this.formConfig.tabs) {
                        const field = (tab.fields || []).find(f => f.fieldId === cleanFieldId);
                        if (field) return field;
                    }
                }
                
                // Search in root fields
                if (this.formConfig.fields) {
                    return this.formConfig.fields.find(f => f.fieldId === cleanFieldId);
                }
                
                return null;
            }

            /**
             * Validate entire form
             */
            validateForm() {
                const fields = document.querySelectorAll('.form-field-input, .form-field-select, .form-field-textarea');
                let isValid = true;
                
                fields.forEach(field => {
                    if (!this.validateField(field)) {
                        isValid = false;
                    }
                });
                
                return isValid;
            }

            /**
             * Collect form data
             */
            collectFormData() {
                const data = {};
                const fields = document.querySelectorAll('.form-field-input, .form-field-select, .form-field-textarea');
                
                fields.forEach(field => {
                    const fieldId = field.id.replace('field_', '');
                    let value = field.value;
                    
                    // Handle different field types
                    if (field.type === 'checkbox') {
                        value = field.checked;
                    } else if (field.type === 'number') {
                        value = parseFloat(value) || 0;
                    } else if (field.type === 'date') {
                        value = field.value ? new Date(field.value).toISOString() : null;
                    }
                    
                    data[fieldId] = value;
                });
                
                // Handle radio buttons
                document.querySelectorAll('input[type="radio"]:checked').forEach(radio => {
                    const fieldName = radio.name.replace('field_', '');
                    data[fieldName] = radio.value;
                });
                
                return data;
            }

            /**
             * Submit form
             */
            async submitForm() {
                try {
                    // Validate form
                    if (!this.validateForm()) {
                        this.showError('يرجى تصحيح الأخطاء في النموذج');
                        return;
                    }
                    
                    // Collect form data
                    const formData = this.collectFormData();
                    
                    // Show loading
                    this.showLoading('جاري حفظ البيانات...');
                    
                    // Submit to server
                    const response = await this.submitFormData(formData);
                    
                    if (response.success) {
                        this.showSuccess('تم حفظ البيانات بنجاح');
                        
                        // Reset form or redirect
                        setTimeout(() => {
                            this.resetForm();
                        }, 2000);
                    } else {
                        throw new Error(response.error || 'فشل في حفظ البيانات');
                    }
                } catch (error) {
                    console.error('Form submission error:', error);
                    this.showError('خطأ في حفظ البيانات: ' + error.message);
                }
            }

            /**
             * Submit form data to server
             */
            async submitFormData(formData) {
                const context = {
                    userId: this.getCurrentUserId(),
                    timestamp: new Date().toISOString()
                };
                
                return new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .processDynamicFormSubmission(this.formConfig.id, formData, context);
                });
            }

            /**
             * Cancel form
             */
            cancelForm() {
                if (confirm('هل أنت متأكد من إلغاء النموذج؟ سيتم فقد البيانات غير المحفوظة.')) {
                    this.resetForm();
                }
            }

            /**
             * Reset form
             */
            resetForm() {
                document.querySelectorAll('.form-field-input, .form-field-textarea').forEach(field => {
                    field.value = '';
                    field.classList.remove('error');
                });
                
                document.querySelectorAll('.form-field-error').forEach(error => {
                    error.textContent = '';
                    error.classList.remove('show');
                });
                
                document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                    checkbox.checked = false;
                });
                
                document.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.checked = false;
                });
            }

            /**
             * Show loading state
             */
            showLoading(message = 'جاري التحميل...') {
                this.container.innerHTML = `
                    <div class="form-loading">
                        <div class="form-loading-spinner"></div>
                        <p>${message}</p>
                    </div>
                `;
            }

            /**
             * Show error message
             */
            showError(message) {
                const errorHtml = `<div class="form-error">${message}</div>`;
                const existingError = this.container.querySelector('.form-error');
                if (existingError) {
                    existingError.remove();
                }
                this.container.insertAdjacentHTML('afterbegin', errorHtml);
            }

            /**
             * Show success message
             */
            showSuccess(message) {
                const successHtml = `<div class="form-success">${message}</div>`;
                const existingSuccess = this.container.querySelector('.form-success');
                if (existingSuccess) {
                    existingSuccess.remove();
                }
                this.container.insertAdjacentHTML('afterbegin', successHtml);
            }

            /**
             * Escape HTML to prevent XSS
             */
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            /**
             * Get current user ID (placeholder)
             */
            getCurrentUserId() {
                // TODO: Implement user ID retrieval
                return 'current_user';
            }
        }

        // Initialize dynamic form when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Get form ID from URL parameters or use default
            const urlParams = new URLSearchParams(window.location.search);
            const formId = urlParams.get('formId') || 'default_form';
            
            const dynamicForm = new DynamicForm('dynamicFormContainer');
            dynamicForm.initialize(formId);
        });
    </script>
</body>
</html>
